<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angielski z Werką</title>
<link rel="stylesheet" href="assets/site.css">
<script src="lessons/lessons.js"></script>
<body class="menu">
<div class="wrap">
  <header>
    <h1>Angielski z Werką</h1>
    <p>Wybierz lekcję. Czytaj na głos, zakrywaj tłumaczenie i ćwicz mówienie.</p>
  </header>
  <ul class="lessons" id="lessons"></ul>
</div>
<script>
// The menu is built from lessons/lessons.js; progress comes from what each lesson saved on this device.
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function progress(slug) {
  try {
    const p = JSON.parse(localStorage.getItem("werka-progress:" + slug));
    if (p && p.total > 0 && p.known > 0) return `<span class="done"><span class="meter"><span style="width:${100 * p.known / p.total}%"></span></span>Umiesz ${p.known} z ${p.total}</span>`;
  } catch (_) {}
  return "";
}
document.getElementById("lessons").innerHTML = LESSONS.map((l, i) => `<li><a class="lesson-link" href="lessons/${esc(l.slug)}.html">
    <span class="num">${i + 1}</span>
    <span class="body"><h2>${esc(l.title)}</h2><p>${esc(l.desc)}</p>${progress(l.slug)}</span>
  </a></li>`).join("") + `<li><div class="lesson-link soon"><span class="num">+</span><span class="body"><h2>Kolejne lekcje wkrótce</h2></span></div></li>`;
</script>
</body>
</html>
